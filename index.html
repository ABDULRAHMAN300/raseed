<style>
@font-face{font-family:"Noto Kufi Arabic";font-weight:400;font-display:swap;src:url(fonts/kufi-ar-400.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:"Noto Kufi Arabic";font-weight:400;font-display:swap;src:url(fonts/kufi-la-400.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Noto Kufi Arabic";font-weight:600;font-display:swap;src:url(fonts/kufi-ar-600.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:"Noto Kufi Arabic";font-weight:600;font-display:swap;src:url(fonts/kufi-la-600.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Noto Kufi Arabic";font-weight:700;font-display:swap;src:url(fonts/kufi-ar-700.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:"Noto Kufi Arabic";font-weight:700;font-display:swap;src:url(fonts/kufi-la-700.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Noto Kufi Arabic";font-weight:800;font-display:swap;src:url(fonts/kufi-ar-800.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:"Noto Kufi Arabic";font-weight:800;font-display:swap;src:url(fonts/kufi-la-800.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#F3F4FA; --card:#FFFFFF; --soft:#EEF0F8; --line:#E3E6F2;
  --text:#191634; --muted:#6B6A86;
  --brand:#5B3DF5; --brand2:#9B35E8; --brand3:#E0457B;
  --hero1:#1B1640; --hero2:#3A1F8C; --hero3:#7A2A9E;
  --inc:#0FB57E; --inc-bg:#E3F8EF;
  --exp:#F0435F; --exp-bg:#FDE7EB;
  --up:#F29B0C; --up-bg:#FFF3DC;
  --info:#1C8FE6; --info-bg:#E2F1FD;
  --shadow:0 6px 24px rgba(40,30,110,.08);
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F0D1F; --card:#1A1733; --soft:#242043; --line:#2E2A52;
    --text:#F1EFFF; --muted:#A5A2C6;
    --inc-bg:#0F3A2C; --exp-bg:#44172A; --up-bg:#43310E; --info-bg:#0E2E4A;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Kufi Arabic",system-ui,sans-serif;font-size:15px;line-height:1.6}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
/* privacy */
body.priv .num,body.priv #balVal,body.priv .amt,body.priv canvas{filter:blur(8px);transition:filter .2s}
/* report */
#reportOv{position:fixed;inset:0;z-index:80;background:#FCF9FB;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rbar{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#493463;color:#fff;z-index:2}
.rbar button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;display:flex;align-items:center;gap:6px}
.rbar .svgi{display:inline-block}
.rhint{font-size:12px;color:#6B6A86;padding:0 16px 30px;text-align:center}
.rp{max-width:760px;margin:0 auto;padding:18px 16px;color:#38323F;font-size:13.5px;line-height:1.7}
.rp header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:3px solid #C998B2;padding-bottom:12px;margin-bottom:6px}
.rp .brandr{font-weight:800;color:#C998B2;font-size:14px}.rp h1{margin:0;color:#493463;font-size:21px;line-height:1.5}.rp .sub{color:#6B6A86;font-size:12.5px}
.rp .gen{font-size:11.5px;color:#6B6A86;text-align:left;white-space:nowrap}
.rp h2{color:#493463;font-size:16px;margin:20px 0 8px;padding-right:10px;border-right:4px solid #C998B2}
.rp .sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rp .sum>div{background:#EEEAF2;border-radius:12px;padding:9px 12px;display:flex;flex-direction:column}
.rp .sum span:first-child{font-size:12px;color:#6B6A86}.rp .sum .n{font-size:16px;font-weight:800;color:#493463}.rp .sum .hl{background:#493463}.rp .sum .hl span{color:#fff!important}
.rp table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.rp th:first-child,.rp td:first-child{width:34%}.rp table.rlist th:first-child,.rp table.rlist td:first-child{width:20%}.rp table.rlist th:nth-child(2),.rp table.rlist td:nth-child(2){width:30%}
.rp th{background:#493463;color:#fff;font-weight:700;padding:7px 6px;text-align:right}.rp td{padding:6px;border-bottom:1px solid #EEEAF2;vertical-align:top;word-wrap:break-word}
.rp tr.grp td{background:#EEEAF2;font-weight:700}.rp tr.grp i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-left:6px}
.rp tr.sub td:first-child{padding-right:22px;color:#6B6A86}.rp tr.tot td{font-weight:800;border-top:2px solid #493463}
.rp .n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}.rp td.in{color:#0B8A5E}.rp td.out{color:#C2334D}
.rp .muted{color:#6B6A86}.rp .foot{margin-top:18px;font-size:11.5px;color:#6B6A86;border-top:1px solid #EEEAF2;padding-top:8px}
@media print{
  @page{size:A4 portrait;margin:14mm}
  html,body{background:#fff!important;padding:0!important}
  body.reporting>*:not(#reportOv){display:none!important}
  #reportOv{position:static;overflow:visible;background:#fff}.rbar,.rhint{display:none!important}
  .rp{max-width:none;padding:0}.rp h2{break-after:avoid}.rp tr{break-inside:avoid}.rp .sum>div{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rp th,.rp tr.grp td,.rp .sum .hl{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.priv .num,body.priv .rp .n{filter:none}
}
/* totals by type */
.tot{padding:14px 12px}
.trow{position:relative;display:grid;grid-template-columns:1.75fr .95fr .8fr 1fr;gap:4px;align-items:center;padding:9px 4px 11px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.trow .num{text-align:left;font-size:12px}.trow.hd{font-size:11px;color:var(--muted);font-weight:700;cursor:default;padding-top:4px}.trow.hd span:not(:first-child){text-align:left}
.tn{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600}.tn>span:last-child{line-height:1.35}.tn .inl{flex-shrink:0}.tn small{color:var(--muted);font-weight:500}
.tbar{position:absolute;bottom:3px;right:4px;height:3px;border-radius:3px;opacity:.75}
.trow.open{background:var(--soft);border-radius:12px;border-bottom-color:transparent}
.tnames{background:var(--soft);border-radius:12px;margin:2px 0 6px;padding:0 8px}.trow.sub{font-size:12.5px;padding:7px 4px;cursor:default;border-bottom:1px dashed var(--line)}.trow.sub:last-child{border-bottom:0}
.trow.ft{font-weight:800;border-bottom:0;cursor:default}.trow.ft .num{font-size:13px}
/* flow tabs */
.segs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sg{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:2px;cursor:pointer;color:var(--text);border:2px solid transparent}
.sg>span{font-size:13px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}.sg>b{font-size:17px}.sg small{font-size:11.5px;color:var(--muted)}
.sg.on.exp{border-color:var(--exp)}.sg.on.exp b{color:var(--exp)}.sg.on.inc{border-color:var(--inc)}.sg.on.inc b{color:var(--inc)}
.dot2{font-style:normal;background:var(--exp);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.tchip{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:7px 11px;display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);flex-shrink:0}
.tchip b{font-size:12.5px;color:var(--muted)}.tchip.on{background:var(--c);color:#fff}.tchip.on b{color:rgba(255,255,255,.85)}
.bdg{position:absolute;top:0;left:calc(50% - 26px);font-style:normal;background:var(--exp);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--card);z-index:2}
.cmp{display:grid;grid-template-columns:1.3fr 1fr 1fr .9fr;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.cmp:last-child{border-bottom:0}.cmp.hd{font-size:11.5px;color:var(--muted);font-weight:700;padding-top:0}.cmp>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:800;border-radius:8px;padding:2px 6px;justify-self:start}
.dl .svgi{display:inline-block}.dl.gd{background:var(--inc-bg);color:var(--inc)}.dl.bd{background:var(--exp-bg);color:var(--exp)}.dl.nt{background:var(--soft);color:var(--muted)}
/* iPhone: 16px+ on fields stops Safari auto-zoom on focus */
input,select,textarea{font-size:16px!important;max-width:100%}
input.amountin{font-size:26px!important}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block;min-height:48px;text-align:right}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{overflow-x:hidden;touch-action:manipulation;overscroll-behavior-y:none}
.grid2>*{min-width:0}
.updbar{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:70;background:linear-gradient(135deg,var(--brand),var(--brand3));color:#fff;border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(91,61,245,.4)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.hidden{display:none!important}

/* header / hero */
.hero{background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 55%,var(--hero3) 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 64px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(224,69,123,.55),transparent 70%);top:-90px;left:-70px}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(28,143,230,.45),transparent 70%);bottom:-110px;right:-40px}
.topbar{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#FFB23F,#E0457B);display:grid;place-items:center;font-size:18px;box-shadow:0 4px 14px rgba(224,69,123,.5)}
.iconbtn{width:40px;height:40px;border-radius:13px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:99px}
.dot{width:8px;height:8px;border-radius:50%;background:#9AA}
.dot.ok{background:#3EE39F}.dot.syncing{background:#FFC34A;animation:pulse 1s infinite}.dot.offline{background:#FF6B81}
@keyframes pulse{50%{opacity:.35}}
.monthnav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;position:relative;z-index:1}
.monthnav button{border:0;background:rgba(255,255,255,.14);color:#fff;width:34px;height:34px;border-radius:11px;font-size:16px;cursor:pointer}
.monthnav .m{font-weight:700;min-width:130px;text-align:center}
.balance{text-align:center;margin-top:10px;position:relative;z-index:1}
.balance small{opacity:.75;font-size:13px}
.balance .big{font-size:34px;font-weight:800;letter-spacing:.3px}
.balance .sub{font-size:12.5px;opacity:.85}

.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.float{margin-top:-46px;position:relative;z-index:2}
.float>h2.sec:first-child{margin-top:0;padding:10px 14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:13px 14px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:19px;font-weight:800;margin-top:2px}
.kpi .chip{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px}
.kpi.inc .chip{background:var(--inc-bg);color:var(--inc)} .kpi.inc .val{color:var(--inc)}
.kpi.exp .chip{background:var(--exp-bg);color:var(--exp)} .kpi.exp .val{color:var(--exp)}
.kpi.up .chip{background:var(--up-bg);color:var(--up)}
.kpi.rate .chip{background:var(--info-bg);color:var(--info)}
.ring{height:5px;background:var(--soft);border-radius:9px;margin-top:8px;overflow:hidden}
.ring i{display:block;height:100%;border-radius:9px}

h2.sec{font-size:16px;font-weight:800;margin:20px 2px 10px;display:flex;align-items:center;justify-content:flex-start}
h2.sec a{margin-inline-start:auto}
h2.sec a{font-size:13px;font-weight:600;color:var(--brand);text-decoration:none;cursor:pointer}
@media (prefers-color-scheme: dark){h2.sec a{color:#B7A6FF}}

.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.row .mid{flex:1;min-width:0}
.svgi{display:block;flex-shrink:0}
.ico.g{color:#fff;border-radius:14px;position:relative;overflow:hidden}
.ico.g::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 45%);pointer-events:none}
.ico.g .svgi{position:relative;z-index:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.hi{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;vertical-align:middle;margin-inline-end:6px}
.inl{display:inline-block;vertical-align:-2px}
.inl .svgi{display:inline-block}
.btn .svgi,.mini .svgi{display:inline-block;vertical-align:-4px;margin-inline-end:6px}
.btn.ghost{display:flex;align-items:center;justify-content:flex-start;gap:4px;text-align:start;font-weight:700;font-size:15px}
.searchw{position:relative}.searchw .svgi{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchw input{padding-right:42px!important}
.iconpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:6px}
.iconpick button{border:2px solid transparent;background:none;padding:3px;border-radius:16px;cursor:pointer;display:grid;place-items:center}
.iconpick button.on{border-color:var(--text)}
.iconpick .ico{width:40px;height:40px}
.grplbl{font-size:12px;color:var(--muted);font-weight:700;margin:10px 2px 6px}
.catb .ic{height:34px;display:grid;place-items:center}
.lock .svgi{display:inline-block}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted)}
.row .amt{font-weight:800;text-align:left;white-space:nowrap}
.amt.inc{color:var(--inc)}.amt.exp{color:var(--exp)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;display:inline-block}
.tag.up{background:var(--up-bg);color:var(--up)}.tag.late{background:var(--exp-bg);color:var(--exp)}.tag.done{background:var(--inc-bg);color:var(--inc)}.tag.muted{background:var(--soft);color:var(--muted)}
.daylbl{font-size:12.5px;color:var(--muted);font-weight:700;padding:12px 4px 6px}
.acts{display:flex;gap:6px;margin-top:6px}
.mini{white-space:nowrap;border:0;border-radius:10px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.mini.ok{background:var(--inc-bg);color:var(--inc)}.mini.skip{background:var(--soft);color:var(--muted)}

.tip{display:flex;gap:12px;padding:13px 14px;border-radius:18px;margin-bottom:10px;background:var(--card);box-shadow:var(--shadow);border-inline-start:5px solid var(--info)}
.tip .ti{font-size:22px;line-height:1.2}
.tip b{display:block;font-size:14.5px}
.tip p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tip.good{border-color:var(--inc)}.tip.warn{border-color:var(--up)}.tip.bad{border-color:var(--exp)}.tip.info{border-color:var(--info)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipb{border:0;background:var(--card);box-shadow:var(--shadow);padding:7px 14px;border-radius:99px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chipb.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:10px}

.bar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:9px;transition:width .4s}
.bline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:5px}

.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14px}
.empty .e{font-size:38px;display:grid;place-items:center;margin-bottom:6px}
.empty .e .ic{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:var(--soft);color:var(--brand)}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);box-shadow:0 -6px 24px rgba(40,30,110,.1);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20;border-radius:24px 24px 0 0}
.tab{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;flex:1;padding:4px 0}
.tab .ti{width:44px;height:30px;border-radius:12px;display:grid;place-items:center;transition:.2s}
.tab.on{color:var(--brand)} .tab.on .ti{background:linear-gradient(135deg,var(--brand),var(--brand3));color:#fff;box-shadow:0 6px 14px rgba(91,61,245,.35)}
@media (prefers-color-scheme: dark){.tab.on{color:#B7A6FF}}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:18px;width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--brand),var(--brand3));color:#fff;font-size:30px;box-shadow:0 10px 26px rgba(91,61,245,.45);z-index:21;cursor:pointer}

/* sheet */
.back{position:fixed;inset:0;background:rgba(15,10,40,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:4px 0 14px;font-size:18px;font-weight:800}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;outline:none}
.f input:focus,.f select:focus{border-color:var(--brand)}
.amountin{font-size:26px!important;font-weight:800;text-align:center;direction:ltr}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on.exp{background:var(--exp);color:#fff}.seg button.on.inc{background:var(--inc);color:#fff}.seg button.on.n{background:var(--brand);color:#fff}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catb{border:2px solid transparent;background:var(--soft);border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;cursor:pointer;line-height:1.3;text-align:center}
.catb .e{font-size:20px}
.catb .ico{width:34px;height:34px;border-radius:11px}
.catb.on{border-color:var(--brand);background:var(--card)}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:16px;cursor:pointer;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 20px rgba(91,61,245,.3)}
.btn.ghost{background:var(--soft);color:var(--text);box-shadow:none}
.btn.danger{background:var(--exp-bg);color:var(--exp);box-shadow:none}
.btns{display:grid;gap:10px;margin-top:6px}
.note{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;margin:8px 0}
.note.warn{background:var(--up-bg);color:#8A5600}
@media (prefers-color-scheme: dark){.note.warn{color:#FFD58A}}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:10px;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--text)}

/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;background:linear-gradient(160deg,var(--hero1),var(--hero2) 60%,var(--hero3))}
.auth .box{background:var(--card);border-radius:26px;padding:24px 20px;max-width:420px;width:100%;margin:0 auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.auth .logo{width:60px;height:60px;border-radius:20px;font-size:30px;margin:0 auto 10px}
.auth h1{text-align:center;margin:0;font-size:24px}
.auth p.c{text-align:center;color:var(--muted);margin:4px 0 18px;font-size:13.5px}
.err{color:var(--exp);font-size:13px;min-height:18px;margin:4px 0}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:6px 0 12px}
.chk input{width:20px;height:20px;accent-color:var(--brand)}
.lock{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:var(--muted);margin-top:14px}

.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#191634;color:#fff;padding:10px 18px;border-radius:14px;z-index:60;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fade .2s}
canvas{max-width:100%}
.legend{display:grid;gap:8px;margin-top:12px}
.lg{display:flex;align-items:center;gap:8px;font-size:13px}
.lg i{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.lg .n{flex:1}
.goalhead{display:flex;align-items:center;gap:12px}
.pct{font-weight:800;font-size:13px}
</style>
</head>
<body>

<!-- AUTH -->
<section id="authView" class="auth hidden">
  <div class="box">
    <div class="logo" data-i="wallet" data-s="20"></div>
    <h1>رصيد</h1>
    <p class="c" id="authSub">سجّل الدخول لمزامنة بياناتك المشفّرة</p>
    <div id="authForm"></div>
  </div>
</section>

<!-- APP -->
<section id="appView" class="hidden">
  <header class="hero">
    <div class="topbar">
      <div class="brand"><div class="logo" data-i="wallet" data-s="20"></div>رصيد</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="sync" id="syncBadge"><span class="dot" id="syncDot"></span><span id="syncTxt">—</span></div>
        <button class="iconbtn" id="btnEye" aria-label="إخفاء المبالغ"></button>
        <button class="iconbtn" id="btnSettings" aria-label="الإعدادات" data-i="settings"></button>
      </div>
    </div>
    <div class="monthnav">
      <button id="mPrev" aria-label="المدة السابقة" data-i="chevron-right" data-s="18" style="display:grid;place-items:center"></button>
      <button class="m" id="mLabel" style="width:auto;height:auto;background:rgba(255,255,255,.14);padding:6px 14px;font-family:inherit;font-weight:700;font-size:15px;border-radius:12px"></button>
      <button id="mNext" aria-label="المدة التالية" data-i="chevron-left" data-s="18" style="display:grid;place-items:center"></button>
    </div>
    <div style="text-align:center;font-size:11.5px;opacity:.7;margin-top:4px;position:relative;z-index:1" id="mDays"></div>
    <div class="balance">
      <small id="balLbl">صافي الشهر</small>
      <div class="big"><span class="num" id="balVal">0.000</span> <span style="font-size:16px">د.ك</span></div>
      <div class="sub" id="balSub"></div>
    </div>
  </header>
  <main class="wrap float" id="main" style="padding-bottom:72px"></main>
  <button class="fab" id="fab" aria-label="إضافة عملية" data-i="plus" data-s="28" style="display:grid;place-items:center"></button>
  <nav class="tabbar">
    <button class="tab on" data-v="home"><span class="ti" data-i="house"></span>الرئيسية</button>
    <button class="tab" data-v="exp"><span class="ti" data-i="receipt"></span><em class="bdg hidden" id="bdgExp"></em>المصروفات</button>
    <button class="tab" data-v="inc"><span class="ti" data-i="hand-coins"></span><em class="bdg hidden" id="bdgInc"></em>الدخل</button>
    <button class="tab" data-v="reports"><span class="ti" data-i="chart-pie"></span>التحليلات</button>
  </nav>
</section>

<div id="sheetHost"></div>

/* ============ SUGGESTIONS ENGINE ============ */
function suggestions() {
  const out = [], t = todayS(), m = mk(t), day = parseD(t).getDate(), dim = daysInMonth(m);
  const prev = [1, 2, 3].map(i => shiftMonth(m, -i)).map(pm => ({ m: pm, ...monthActual(pm) })).filter(x => x.income > 0 || x.expense > 0);
  const avg = f => prev.length ? prev.reduce((s, x) => s + f(x), 0) / prev.length : 0;
  const p = projection(m);
  const L = { bad: 0, warn: 1, info: 2, good: 3 };
  const add = (level, icon, title, text) => out.push({ level, icon, title, text });

  if (!live('tx').length && !live('rec').length) {
    add('info', '👋', 'ابدأ بتسجيل عملياتك', 'أضف راتبك ومصروفاتك الثابتة (إيجار، اشتراكات، أقساط) في «المتكررة»، وستظهر هنا اقتراحات مبنية على أرقامك.');
    return out;
  }
  // 1) savings rate (projected)
  if (p.pIncome > 0) {
    const rate = (p.pIncome - p.pExpense) / p.pIncome;
    if (rate < 0) add('bad', '🚨', 'المصروف المتوقع يتجاوز الدخل', `بحسب العمليات والمتكررة، نهاية ${mLabel(m)} تتجه لعجز ${fmt(-p.pNet)} د.ك. راجع المصروفات القادمة أو أجّل غير الضروري.`);
    else if (rate < 0.1) add('warn', '📉', `نسبة الادخار المتوقعة ${Math.round(rate * 100)}%`, `المتبقي المتوقع ${fmt(p.pNet)} د.ك. قاعدة شائعة تستهدف ادخار 20% تقريبًا من الدخل (${fmt(p.pIncome * 0.2)} د.ك هذا الشهر).`);
    else if (rate >= 0.2) add('good', '🌟', `نسبة ادخار ممتازة: ${Math.round(rate * 100)}%`, `المتوقع أن يتبقى ${fmt(p.pNet)} د.ك. فكّر في تحويل جزء منه مباشرة إلى أحد أهدافك.`);
  }
  // 2) budgets
  const a = monthActual(m);
  for (const b of live('budgets')) {
    const spent = a.byCat[b.catId] || 0; const c = cat(b.catId); if (!b.limit) continue;
    const pct = spent / b.limit;
    if (pct >= 1) add('bad', '⛔', `تجاوزت ميزانية ${c.name}`, `صرفت ${fmt(spent)} من ${fmt(b.limit)} د.ك (${Math.round(pct * 100)}%).`);
    else if (pct >= 0.8) add('warn', '⚠️', `اقتربت من حد ${c.name}`, `المتبقي ${fmt(b.limit - spent)} د.ك لـ ${dim - day} يومًا — أي نحو ${fmt((b.limit - spent) / Math.max(1, dim - day))} د.ك يوميًا.`);
  }
  // 3) category spikes vs 3-month average
  if (prev.length) {
    for (const c of live('categories').filter(c => c.kind === 'expense')) {
      const cur = a.byCat[c.id] || 0; const av = avg(x => x.byCat[c.id] || 0);
      if (av > 0 && cur > av * 1.15 && cur - av >= 5) add('warn', c.icon, `${c.name}: أعلى من معدلك`, `صرفت هذا الشهر ${fmt(cur)} د.ك مقابل متوسط ${fmt(av)} د.ك في الأشهر السابقة (+${Math.round((cur / av - 1) * 100)}%).`);
    }
  }
  // 4) subscriptions
  const subs = live('rec').filter(r => r.type === 'expense' && r.catId === 'c_subs' && !r.paused);
  if (subs.length >= 2) { const tot = subs.reduce((s, r) => s + monthlyEq(r), 0); add('info', '📺', `${subs.length} اشتراكات بـ ${fmt(tot)} د.ك شهريًا`, `أي ${fmt(tot * 12)} د.ك سنويًا. إلغاء اشتراك واحد غير مستخدم يوفّر مبلغًا ثابتًا كل شهر.`); }
  // 5) income concentration & private lessons
  const incPrev = prev.reduce((s, x) => s + x.income, 0);
  if (incPrev > 0) {
    const sal = prev.reduce((s, x) => s + (x.byCat['c_salary'] || 0), 0);
    const les = prev.reduce((s, x) => s + (x.byCat['c_lessons'] || 0), 0);
    const lesTx = txAll().filter(x => x.catId === 'c_lessons' && x.date <= t);
    const perLesson = lesTx.length ? lesTx.reduce((s, x) => s + x.amount, 0) / lesTx.length : 0;
    if (sal / incPrev > 0.85) add('info', '🧩', `${Math.round(sal / incPrev * 100)}% من دخلك من الراتب`, perLesson > 0 ? `تنويع الدخل يقلل المخاطر. متوسط عملية «حصص خارجية» لديك ${fmt(perLesson)} د.ك؛ إضافة واحدة أسبوعيًا تضيف تقريبًا ${fmt(perLesson * 52 / 12)} د.ك شهريًا.` : 'تنويع مصادر الدخل (حصص خارجية، مكافآت، مشاريع جانبية) يقلل الاعتماد على مصدر واحد.');
    const lesAvg = les / prev.length; const lesCur = a.byCat['c_lessons'] || 0;
    if (lesAvg > 0 && day >= 20 && lesCur < lesAvg * 0.8) add('warn', '🧪', 'دخل الحصص الخارجية أقل من معدله', `${fmt(lesCur)} د.ك حتى الآن مقابل متوسط ${fmt(lesAvg)} د.ك شهريًا.`);
    if (lesAvg > 0 && lesCur > lesAvg * 1.2) add('good', '🧪', 'دخل الحصص الخارجية في ارتفاع', `${fmt(lesCur)} د.ك هذا الشهر مقابل متوسط ${fmt(lesAvg)} د.ك. هذا الفائض مناسب لتسريع أحد أهدافك.`);
  }
  // 6) goals feasibility
  const surplus = prev.length ? avg(x => x.net) : p.pNet;
  for (const g of live('goals')) {
    const saved = goalSaved(g), left = g.target - saved; if (left <= 0 || !g.date) continue;
    const months = Math.max(1, monthsBetween(m, mk(g.date)) + (g.date.slice(8) >= pad(day) ? 0 : 0));
    const need = left / months;
    if (surplus > 0 && need > surplus) add('warn', '🎯', `هدف «${g.name}» يحتاج ${fmt(need)} د.ك شهريًا`, `متوسط فائضك ${fmt(surplus)} د.ك. مدّد الموعد أو خفّض مصروفًا متغيرًا ليصبح الهدف واقعيًا.`);
    else if (surplus > 0) add('good', '🎯', `هدف «${g.name}» ممكن`, `يحتاج ${fmt(need)} د.ك شهريًا لمدة ${months} شهر، وهو ضمن متوسط فائضك (${fmt(surplus)} د.ك).`);

  // 8) dining share & top category
  const expAll = prev.reduce((s, x) => s + x.expense, 0) + a.expense;
  if (expAll > 0) {

    if (din / expAll > 0.15) add('info', '☕', `المطاعم والمقاهي ${Math.round(din / expAll * 100)}% من مصروفك`, `خفضها بمقدار الربع يوفر تقريبًا ${fmt(din / (prev.length + 1) * 0.25 * 12)} د.ك سنويًا.`);
    const totals = {}; for (const x of [...prev, a]) for (const [k, v] of Object.entries(x.byCat)) if (cat(k).kind === 'expense') totals[k] = (totals[k] || 0) + v;
    const top = Object.entries(totals).sort((x, y) => y[1] - x[1])[0];
    if (top && !['c_housing', 'c_loans'].includes(top[0])) { const perM = top[1] / (prev.length + 1); add('info', cat(top[0]).icon, `أكبر بند متغير: ${cat(top[0]).name}`, `متوسطه ${fmt(perM)} د.ك شهريًا. توفير 10% منه فقط = ${fmt(perM * 0.1 * 12)} د.ك سنويًا.`); }
  }
  return out.sort((x, y) => L[x.level] - L[y.level]);
}

async function restoreFrom({ h, s }) {
  if (!s) {
    openSheet(`<h3>استعادة نسخة قديمة</h3><div class="note">هذه النسخة محفوظة بكلمة سر تشفير سابقة. أدخل الكلمة التي كانت مستخدمة وقتها.</div>
      <div class="f"><input id="hrP" type="password" dir="ltr"></div><div class="err" id="hrE"></div><button class="btn" id="hrGo">فتح</button>`);
    $('#hrGo').onclick = async () => { try { const full = (await SB.from('fin_vault_history').select('*').eq('id', h.id).single()).data;
        const pk = await deriveKey($('#hrP').value, full.salt);
        const key = full.kid && full.wrap_p ? await importDK(await unwrapRaw(pk, full.wrap_p)) : pk;
        restoreFrom({ h, s: await decryptObj(key, full.iv, full.data) }); } catch { $('#hrE').textContent = 'الكلمة غير صحيحة'; } };
    return;
  }
  const c = countItems(s), cur = countItems(state);
  confirmSheet('استعادة هذه النسخة؟', `ستصبح بياناتك ${c.tx} عملية و${c.rec} متكررة (الآن ${cur.tx} و${cur.rec}). تُحفظ النسخة الحالية في السجل قبل الاستبدال، ويمكنك الرجوع إليها.`, 'استعادة', async () => {
    const now = Date.now(), out = { v: 1, settings: { ...(s.settings || {}), updatedAt: now } };
    for (const col of COLS) {
      const keep = new Map((s[col] || []).map(x => [x.id, { ...x, updatedAt: now }]));
      for (const x of state[col]) if (!keep.has(x.id)) keep.set(x.id, { ...x, deleted: true, updatedAt: now });
      out[col] = [...keep.values()];
    }
    state = out; await saveLocal(); render();
    if (SB && !(await pushNow({ snap: true }))) { toast('تمت الاستعادة على الجهاز، وستُرفع عند الاتصال'); return; }
    toast('تمت الاستعادة');
  });
}

/* ============ PERIOD REPORT (print / PDF) ============ */
function reportGroups(type, done, pend) {
  const g = {};
  const add = (catId, name, amt, isDone) => { const c = g[catId] = g[catId] || { d: 0, p: 0, n: 0, names: {} };
    const k = (name || '').trim() || cat(catId).name; const nm = c.names[k] = c.names[k] || { d: 0, p: 0, n: 0 };
    c.n++; nm.n++; if (isDone) { c.d += amt; nm.d += amt; } else { c.p += amt; nm.p += amt; } };
  done.filter(x => x.type === type).forEach(x => add(x.catId, txName(x), x.amount, true));
  pend.filter(u => u.type === type).forEach(u => add(u.catId, u.name, u.amount, false));
  return Object.entries(g).sort((a, b) => (b[1].d + b[1].p) - (a[1].d + a[1].p));
}
function openReport() {
  const p = projectionRange(PER.from, PER.to);

  const rA = rateOf(p.income, p.expense), rP = rateOf(p.pIncome, p.pExpense);
  const f = n => `<span class="n">${fmt(n)}</span>`;
  const grpTable = (type, title) => {
    const rows = reportGroups(type, done, pend); const inc = type === 'income';
    if (!rows.length) return `<h2>${title}</h2><p class="muted">لا توجد عمليات في هذه المدة.</p>`;
    const tot = rows.reduce((s, [, v]) => s + v.d + v.p, 0) || 1;
    return `<h2>${title}</h2><table><thead><tr><th>الصنف / اسم العملية</th><th>العدد</th><th>تم</th><th>${inc ? 'متوقع' : 'قادم'}</th><th>المجموع</th><th>%</th></tr></thead><tbody>
      ${rows.map(([k, v]) => `<tr class="grp"><td><i style="background:${cat(k).color}"></i>${esc(cat(k).name)}</td><td>${v.n}</td><td>${f(v.d)}</td><td>${v.p ? f(v.p) : '—'}</td><td><b>${f(v.d + v.p)}</b></td><td>${Math.round((v.d + v.p) / tot * 100)}%</td></tr>
        ${Object.entries(v.names).sort((a, b) => (b[1].d + b[1].p) - (a[1].d + a[1].p)).map(([n, x]) => `<tr class="sub"><td>${esc(n)}</td><td>${x.n}</td><td>${f(x.d)}</td><td>${x.p ? f(x.p) : '—'}</td><td>${f(x.d + x.p)}</td><td></td></tr>`).join('')}`).join('')}
      <tr class="tot"><td>الإجمالي</td><td>${rows.reduce((s, [, v]) => s + v.n, 0)}</td><td>${f(rows.reduce((s, [, v]) => s + v.d, 0))}</td><td>${f(rows.reduce((s, [, v]) => s + v.p, 0))}</td><td>${f(tot === 1 ? 0 : tot)}</td><td>100%</td></tr></tbody></table>`;
  };
  const all = [...done.map(x => ({ date: x.date, name: txName(x), catId: x.catId, type: x.type, amount: x.amount, st: 'تم' })),
               ...pend.map(u => ({ date: u.date, name: u.name, catId: u.catId, type: u.type, amount: u.amount, st: u.due ? 'مستحق' : (u.type === 'income' ? 'متوقع' : 'قادم') }))].sort((a, b) => a.date.localeCompare(b.date));
  const d = new Date();

    <header><div><div class="brandr">رصيد</div><h1>التقرير المالي للمدة</h1><div class="sub">${esc(perLabel())} · من ${f0(PER.from)} إلى ${f0(PER.to)} (${perDays()} يومًا)</div></div>
      <div class="gen">أُنشئ في<br>${f0(ymd(d))} · ${pad(d.getHours())}:${pad(d.getMinutes())}</div></header>
    <h2>الملخص التنفيذي</h2>
    <div class="sum">
      <div><span>دخل تم استلامه</span>${f(p.income)}</div><div><span>دخل متوقع</span>${f(p.upI)}</div>
      <div><span>مصروف تم</span>${f(p.expense)}</div><div><span>مصروف قادم</span>${f(p.upE)}</div>
      <div class="hl"><span>الصافي الفعلي</span>${f(p.net)}</div><div class="hl"><span>الصافي المتوقع</span>${f(p.pNet)}</div>
      <div><span>نسبة الادخار الفعلية</span><span class="n">${rA === null ? '—' : rA + '%'}</span></div><div><span>نسبة الادخار المتوقعة</span><span class="n">${rP === null ? '—' : rP + '%'}</span></div>
    </div>
    <h2>مقارنة بالمدة السابقة</h2><p class="muted" style="margin:-4px 0 6px;font-size:12px">المدة السابقة: من ${f0(pr.from)} إلى ${f0(pr.to)}</p>
    <table><thead><tr><th>البند</th><th>الحالية</th><th>السابقة</th><th>التغيّر</th></tr></thead><tbody>
      ${[['الدخل', p.income, prev.income], ['المصروف', p.expense, prev.expense], ['الصافي', p.net, prev.net]].map(([n, a, b]) => `<tr><td>${n}</td><td>${f(a)}</td><td>${f(b)}</td><td>${b ? `<span class="n">${Math.round((a - b) / Math.abs(b) * 100)}%</span>` : '—'}</td></tr>`).join('')}
    </tbody></table>
    ${grpTable('expense', 'المصروفات حسب الصنف')}
    ${grpTable('income', 'الدخل حسب الصنف')}
    <h2>كشف العمليات</h2>
    ${all.length ? `<table class="rlist"><thead><tr><th>التاريخ</th><th>اسم العملية</th><th>الصنف</th><th>الحالة</th><th>المبلغ</th></tr></thead><tbody>
      ${all.map(x => `<tr><td><span class="n">${f0(x.date)}</span></td><td>${esc(x.name)}</td><td>${esc(cat(x.catId).name)}</td><td>${x.st}</td><td class="${x.type === 'income' ? 'in' : 'out'}"><span class="n">${x.type === 'income' ? '+' : '−'}${fmt(x.amount)}</span></td></tr>`).join('')}</tbody></table>` : '<p class="muted">لا توجد عمليات.</p>'}
    <p class="foot">المبالغ بالدينار الكويتي (د.ك). «متوقع/قادم» عمليات لم تُؤكَّد بعد. أُعدّ التقرير على جهازك من بياناتك المشفّرة.</p>
  </div>`;
  const ov = document.createElement('div'); ov.id = 'reportOv';
  ov.innerHTML = `<div class="rbar"><button id="rpClose">${I('x', 20)}</button><b>تقرير المدة</b><button id="rpPrint">${I('printer', 18)} طباعة / PDF</button></div>${html}
    <div class="rhint">إن لم تظهر نافذة الطباعة داخل التطبيق المثبّت: افتح الرابط من سفاري ثم «مشاركة ← طباعة ← مشاركة ← حفظ في الملفات» لحفظه PDF.</div>`;
  document.body.appendChild(ov); document.body.classList.add('reporting'); scrollTo(0, 0);
  $('#rpClose').onclick = () => { ov.remove(); document.body.classList.remove('reporting'); };
  $('#rpPrint').onclick = () => { try { window.print(); } catch { toast('الطباعة غير متاحة هنا'); } };
}
function f0(s) { const [y, m, d] = s.split('-'); return `${+d}/${+m}/${y}`; }

/* ============ AUTO UPDATE ============ */
const APP_VERSION = '2026.09.26-2';
let updChecking = false;
async function checkUpdate() {
  if (updChecking || location.protocol !== 'https:') return; updChecking = true;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const { v } = await r.json();
    const last = ls.get('rs_upd_try') || {};
    if (v && v !== APP_VERSION && !(last.v === v && Date.now() - last.t < 15 * 60000)) {
      ls.set('rs_upd_try', { v, t: Date.now() });
      const bar = document.createElement('div'); bar.className = 'updbar'; bar.innerHTML = I('refresh-cw', 18) + '<span>يتم تحديث التطبيق إلى أحدث نسخة…</span>';
      document.body.appendChild(bar);
      await Promise.all(['./', 'index.html'].map(u => fetch(u, { cache: 'reload' }).catch(() => {})));
      setTimeout(() => location.reload(), 600);
    }
  } catch {} finally { updChecking = false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
