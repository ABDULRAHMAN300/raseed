<style>
@font-face{font-family:"Noto Kufi Arabic";font-weight:400;font-display:swap;src:url(fonts/kufi-ar-400.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:"Noto Kufi Arabic";font-weight:400;font-display:swap;src:url(fonts/kufi-la-400.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:"Noto Kufi Arabic";font-weight:600;font-display:swap;src:url(fonts/kufi-la-600.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Noto Kufi Arabic";font-weight:700;font-display:swap;src:url(fonts/kufi-ar-700.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:"Noto Kufi Arabic";font-weight:700;font-display:swap;src:url(fonts/kufi-la-700.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Noto Kufi Arabic";font-weight:800;font-display:swap;src:url(fonts/kufi-ar-800.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:"Noto Kufi Arabic";font-weight:800;font-display:swap;src:url(fonts/kufi-la-800.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#F3F4FA; --card:#FFFFFF; --soft:#EEF0F8; --line:#E3E6F2;
  --text:#191634; --muted:#6B6A86;
  --brand:#5B3DF5; --brand2:#9B35E8; --brand3:#E0457B;
  --hero1:#1B1640; --hero2:#3A1F8C; --hero3:#7A2A9E;
  --inc:#0FB57E; --inc-bg:#E3F8EF;
  --exp:#F0435F; --exp-bg:#FDE7EB;
  --up:#F29B0C; --up-bg:#FFF3DC;
  --info:#1C8FE6; --info-bg:#E2F1FD;
  --shadow:0 6px 24px rgba(40,30,110,.08);
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F0D1F; --card:#1A1733; --soft:#242043; --line:#2E2A52;
    --text:#F1EFFF; --muted:#A5A2C6;
    --inc-bg:#0F3A2C; --exp-bg:#44172A; --up-bg:#43310E; --info-bg:#0E2E4A;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Kufi Arabic",system-ui,sans-serif;font-size:15px;line-height:1.6}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.hidden{display:none!important}

/* header / hero */
.hero{background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 55%,var(--hero3) 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 64px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(224,69,123,.55),transparent 70%);top:-90px;left:-70px}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(28,143,230,.45),transparent 70%);bottom:-110px;right:-40px}
.topbar{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#FFB23F,#E0457B);display:grid;place-items:center;font-size:18px;box-shadow:0 4px 14px rgba(224,69,123,.5)}
.iconbtn{width:40px;height:40px;border-radius:13px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:99px}
.dot{width:8px;height:8px;border-radius:50%;background:#9AA}
.dot.ok{background:#3EE39F}.dot.syncing{background:#FFC34A;animation:pulse 1s infinite}.dot.offline{background:#FF6B81}
@keyframes pulse{50%{opacity:.35}}
.monthnav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;position:relative;z-index:1}
.monthnav button{border:0;background:rgba(255,255,255,.14);color:#fff;width:34px;height:34px;border-radius:11px;font-size:16px;cursor:pointer}
.monthnav .m{font-weight:700;min-width:130px;text-align:center}
.balance{text-align:center;margin-top:10px;position:relative;z-index:1}
.balance small{opacity:.75;font-size:13px}
.balance .big{font-size:34px;font-weight:800;letter-spacing:.3px}
.balance .sub{font-size:12.5px;opacity:.85}

.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.float{margin-top:-46px;position:relative;z-index:2}
.float>h2.sec:first-child{margin-top:0;padding:10px 14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:13px 14px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:19px;font-weight:800;margin-top:2px}
.kpi .chip{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px}
.kpi.inc .chip{background:var(--inc-bg);color:var(--inc)} .kpi.inc .val{color:var(--inc)}
.kpi.exp .chip{background:var(--exp-bg);color:var(--exp)} .kpi.exp .val{color:var(--exp)}
.kpi.up .chip{background:var(--up-bg);color:var(--up)}
.kpi.rate .chip{background:var(--info-bg);color:var(--info)}
.ring{height:5px;background:var(--soft);border-radius:9px;margin-top:8px;overflow:hidden}
.ring i{display:block;height:100%;border-radius:9px}

h2.sec{font-size:16px;font-weight:800;margin:20px 2px 10px;display:flex;align-items:center;justify-content:space-between}
h2.sec a{font-size:13px;font-weight:600;color:var(--brand);text-decoration:none;cursor:pointer}
@media (prefers-color-scheme: dark){h2.sec a{color:#B7A6FF}}

.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted)}
.row .amt{font-weight:800;text-align:left;white-space:nowrap}
.amt.inc{color:var(--inc)}.amt.exp{color:var(--exp)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;display:inline-block}
.tag.up{background:var(--up-bg);color:var(--up)}.tag.late{background:var(--exp-bg);color:var(--exp)}.tag.done{background:var(--inc-bg);color:var(--inc)}.tag.muted{background:var(--soft);color:var(--muted)}
.daylbl{font-size:12.5px;color:var(--muted);font-weight:700;padding:12px 4px 6px}
.acts{display:flex;gap:6px;margin-top:6px}
.mini{border:0;border-radius:10px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.mini.ok{background:var(--inc-bg);color:var(--inc)}.mini.skip{background:var(--soft);color:var(--muted)}

.tip{display:flex;gap:12px;padding:13px 14px;border-radius:18px;margin-bottom:10px;background:var(--card);box-shadow:var(--shadow);border-inline-start:5px solid var(--info)}
.tip .ti{font-size:22px;line-height:1.2}
.tip b{display:block;font-size:14.5px}
.tip p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tip.good{border-color:var(--inc)}.tip.warn{border-color:var(--up)}.tip.bad{border-color:var(--exp)}.tip.info{border-color:var(--info)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipb{border:0;background:var(--card);box-shadow:var(--shadow);padding:7px 14px;border-radius:99px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chipb.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:10px}

.bar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:9px;transition:width .4s}
.bline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:5px}

.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14px}
.empty .e{font-size:38px}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);box-shadow:0 -6px 24px rgba(40,30,110,.1);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20;border-radius:24px 24px 0 0}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;flex:1;padding:4px 0}
.tab .ti{font-size:20px;filter:grayscale(1);opacity:.6}
.tab.on{color:var(--brand)} .tab.on .ti{filter:none;opacity:1}
@media (prefers-color-scheme: dark){.tab.on{color:#B7A6FF}}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:18px;width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--brand),var(--brand3));color:#fff;font-size:30px;box-shadow:0 10px 26px rgba(91,61,245,.45);z-index:21;cursor:pointer}

/* sheet */
.back{position:fixed;inset:0;background:rgba(15,10,40,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:4px 0 14px;font-size:18px;font-weight:800}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;outline:none}
.f input:focus,.f select:focus{border-color:var(--brand)}
.amountin{font-size:26px!important;font-weight:800;text-align:center;direction:ltr}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on.exp{background:var(--exp);color:#fff}.seg button.on.inc{background:var(--inc);color:#fff}.seg button.on.n{background:var(--brand);color:#fff}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catb{border:2px solid transparent;background:var(--soft);border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;cursor:pointer;line-height:1.3;text-align:center}
.catb .e{font-size:20px}
.catb.on{border-color:var(--brand);background:var(--card)}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:16px;cursor:pointer;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 20px rgba(91,61,245,.3)}
.btn.ghost{background:var(--soft);color:var(--text);box-shadow:none}
.btn.danger{background:var(--exp-bg);color:var(--exp);box-shadow:none}
.btns{display:grid;gap:10px;margin-top:6px}
.note{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;margin:8px 0}
.note.warn{background:var(--up-bg);color:#8A5600}
@media (prefers-color-scheme: dark){.note.warn{color:#FFD58A}}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:10px;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--text)}

/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;background:linear-gradient(160deg,var(--hero1),var(--hero2) 60%,var(--hero3))}
.auth .box{background:var(--card);border-radius:26px;padding:24px 20px;max-width:420px;width:100%;margin:0 auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.auth .logo{width:60px;height:60px;border-radius:20px;font-size:30px;margin:0 auto 10px}
.auth h1{text-align:center;margin:0;font-size:24px}
.auth p.c{text-align:center;color:var(--muted);margin:4px 0 18px;font-size:13.5px}
.err{color:var(--exp);font-size:13px;min-height:18px;margin:4px 0}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:6px 0 12px}
.chk input{width:20px;height:20px;accent-color:var(--brand)}
.lock{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:var(--muted);margin-top:14px}

.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#191634;color:#fff;padding:10px 18px;border-radius:14px;z-index:60;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fade .2s}
canvas{max-width:100%}
.legend{display:grid;gap:8px;margin-top:12px}
.lg{display:flex;align-items:center;gap:8px;font-size:13px}
.lg i{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.lg .n{flex:1}
.goalhead{display:flex;align-items:center;gap:12px}
.pct{font-weight:800;font-size:13px}
</style>
</head>

  <div class="box">
    <div class="logo">💸</div>

<!-- APP -->
<section id="appView" class="hidden">
  <header class="hero">

      <div class="brand"><div class="logo">💸</div>رصيد</div>

<script>
/* ============ CONFIG ============ */
const CONFIG = {
  SUPABASE_URL: 'https://dwsyctxhfbuzpcjilmwq.supabase.co',
  SUPABASE_KEY: 'sb_publishable_xDrnFMfYxuqI008QnSZ8yA_JoKKMqzg'
};
const HAS_CLOUD = CONFIG.SUPABASE_URL.startsWith('https://') && !!window.supabase;

/* ============ UTIL ============ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayS = () => ymd(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const mk = s => s.slice(0, 7);
const shiftMonth = (m, n) => { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const mLabel = m => { const [y, mm] = m.split('-').map(Number); return MONTHS[mm - 1] + ' ' + y; };
const dLabel = s => { const d = parseD(s); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const dShort = s => { const d = parseD(s); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const r3 = n => Math.round(n * 1000) / 1000;
const fmt = n => r3(n).toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
const money = n => '<span class="num">' + fmt(n) + '</span> د.ك';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ============ CRYPTO (AES-256-GCM, PBKDF2) ============ */
const te = new TextEncoder(), td = new TextDecoder();

/* IndexedDB: stores the non-extractable CryptoKey so this device can stay unlocked */

function defaultState() { return { v: 1, categories: defaultCats(), tx: [], rec: [], budgets: [], goals: [], goalMoves: [], settings: { updatedAt: 0 } }; }
let state = defaultState();

function upsert(col, obj) {
  obj.updatedAt = Date.now();

  if (!a) return b; if (!b) return a;

    const m = new Map();

/* ============ SESSION / SYNC ============ */
let SB = null, USER = null, KEY = null, SALT = null, baseVersion = 0;
let pushTimer = null, pushing = false, dirty = false;
const cacheKey = () => 'nf_cache_' + USER.id;
function setSync(s) {
  const dot = $('#syncDot'), txt = $('#syncTxt'); if (!dot) return;
  dot.className = 'dot ' + (s === 'ok' ? 'ok' : s === 'syncing' ? 'syncing' : s === 'offline' ? 'offline' : '');
  txt.textContent = { ok: 'متزامن', syncing: 'مزامنة…', offline: 'غير متصل', local: 'على الجهاز' }[s] || s;
}
async function saveLocal() {
  if (!KEY) return;
  const p = await encryptObj(KEY, state);
  ls.set(cacheKey(), { salt: SALT, iv: p.iv, data: p.data, version: baseVersion });
}
function changed() { saveLocal(); render(); schedulePush(); }
function schedulePush() { if (!SB) return; dirty = true; clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 1200); }
async function fetchRemote() {
  if (!SB) return null;
  const { data, error } = await SB.from('fin_vault').select('user_id,salt,iv,data,version').eq('user_id', USER.id).maybeSingle();
  if (error) throw error; return data;
}
async function pushNow(opts = {}) {
  if (!SB || !KEY) return;
  if (pushing) { dirty = true; return; }
  pushing = true; dirty = false; setSync('syncing');
  try {
    let done = false;
    for (let attempt = 0; attempt < 5 && !done; attempt++) {
      const remote = await fetchRemote();
      if (remote && remote.version !== baseVersion && !opts.newSalt) {
        if (remote.salt !== SALT) throw new Error('SALT_CHANGED');
        const r = await decryptObj(KEY, remote.iv, remote.data);
        state = merge(state, r); baseVersion = remote.version; render();
      }
      const p = await encryptObj(KEY, state);
      if (!remote) {
        const { error } = await SB.from('fin_vault').insert({ user_id: USER.id, salt: SALT, iv: p.iv, data: p.data, version: 1 });
        if (error) { if (error.code === '23505') continue; throw error; }

      } else {
        const expected = opts.newSalt ? remote.version : baseVersion;
        const row = { iv: p.iv, data: p.data, version: expected + 1, updated_at: new Date().toISOString() };
        if (opts.newSalt) row.salt = SALT;
        const { data, error } = await SB.from('fin_vault').update(row).eq('user_id', USER.id).eq('version', expected).select('version');
        if (error) throw error;
        if (!data || !data.length) continue;
        baseVersion = data[0].version; done = true;
      }
    }
    await saveLocal();
    setSync(done ? 'ok' : 'offline');
  } catch (e) {
    console.warn(e);
    if (e.message === 'SALT_CHANGED') { toast('تم تغيير كلمة سر التشفير من جهاز آخر'); await lockApp(true); }

}
async function pullNow() {
  if (!SB || !KEY || pushing) return;
  try {
    const remote = await fetchRemote();
    if (!remote) return pushNow();
    if (remote.version === baseVersion) { setSync('ok'); return; }
    if (remote.salt !== SALT) { await lockApp(true); return; }
    const r = await decryptObj(KEY, remote.iv, remote.data);
    const merged = merge(state, r); baseVersion = remote.version;
    const needPush = sig(merged) !== sig(r);
    state = merged; await saveLocal(); render();
    if (needPush) pushNow(); else setSync('ok');
  } catch (e) { setSync('offline'); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pullNow(); });
window.addEventListener('online', () => pullNow());

async function afterLogin() {
  const cache = ls.get(cacheKey());

  const salt = (remote && remote.salt) || (cache && cache.salt) || null;
  const rem = await idbGet('key_' + USER.id);
  if (rem && salt && rem.salt === salt) {
    if (await unlockWith(rem.key, salt, remote, cache)) return;
    await idbDel('key_' + USER.id);

  showPass(salt ? 'unlock' : 'create', salt, remote, cache);
}

  KEY = key; SALT = salt;

  state = merge(merge(defaultState(), local), rem);
  for (const c of COLS) state[c] = state[c] || [];

  await saveLocal();

    if (remote === null) pushNow();

/* ============ CALCULATIONS ============ */
let VIEW = 'home', VM = mk(todayS()), TXF = 'all', TXQ = '';
const txAll = () => live('tx').filter(t => !t.skipped);
const isInc = t => t.type === 'income';
function monthActual(m) {
  const t = todayS(); let income = 0, expense = 0; const byCat = {};
  for (const x of txAll()) { if (mk(x.date) !== m || x.date > t) continue;
    if (isInc(x)) income += x.amount; else expense += x.amount;
    byCat[x.catId] = (byCat[x.catId] || 0) + x.amount; }
  return { income: r3(income), expense: r3(expense), net: r3(income - expense), byCat };
}
function occurrences(r, from, to) {
  const out = []; if (r.paused || !r.start) return out;
  const end = r.end && r.end < to ? r.end : to; const every = Math.max(1, r.every || 1);
  if (r.freq === 'weekly') {
    let d = r.start; if (d < from) { const diff = Math.floor((parseD(from) - parseD(d)) / 86400000); const k = Math.floor(diff / (7 * every)); d = addDays(d, k * 7 * every); }
    for (let i = 0; i < 400 && d <= end; i++) { if (d >= from) out.push(d); d = addDays(d, 7 * every); }
  } else {
    const sd = parseD(r.start); const step = r.freq === 'yearly' ? 12 * every : every;
    for (let i = 0; i < 600; i++) {
      const y = sd.getFullYear(), m0 = sd.getMonth() + i * step; const dt = new Date(y, m0, 1);
      const dim = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
      const s = ymd(new Date(dt.getFullYear(), dt.getMonth(), Math.min(sd.getDate(), dim)));
      if (s > end) break; if (s >= from) out.push(s);
    }
  }
  return out;
}
function doneSet() { const s = new Set(); for (const t of live('tx')) if (t.recId) s.add(t.recId + '@' + t.recDate); return s; }
function upcoming(days = 30, fromOverride) {
  const t = todayS(), to = addDays(t, days), ds = doneSet(), out = [];
  for (const r of live('rec')) {
    const from = fromOverride || (r.start > addDays(t, -60) ? r.start : addDays(t, -60));
    for (const d of occurrences(r, from, to)) if (!ds.has(r.id + '@' + d)) out.push({ kind: 'rec', r, date: d, type: r.type, amount: r.amount, catId: r.catId, name: r.name, overdue: d < t });
  }
  for (const x of txAll()) if (x.date > t && x.date <= to) out.push({ kind: 'tx', x, date: x.date, type: x.type, amount: x.amount, catId: x.catId, name: x.note || cat(x.catId).name, overdue: false });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function projection(m) {
  const a = monthActual(m); const t = todayS();
  const cur = mk(t);
  let upI = 0, upE = 0;
  if (m >= cur) {
    const start = m === cur ? addDays(t, 1) : m + '-01'; const end = m + '-' + pad(daysInMonth(m));
    const ds = doneSet();
    for (const r of live('rec')) for (const d of occurrences(r, m + '-01', end)) {
      if (ds.has(r.id + '@' + d)) continue;
      if (r.type === 'income') upI += r.amount; else upE += r.amount; }
    for (const x of txAll()) if (x.date >= start && x.date <= end) { if (isInc(x)) upI += x.amount; else upE += x.amount; }
  }
  return { ...a, upI: r3(upI), upE: r3(upE), pIncome: r3(a.income + upI), pExpense: r3(a.expense + upE), pNet: r3(a.income + upI - a.expense - upE) };
}
const monthlyEq = r => { const e = Math.max(1, r.every || 1); return r.freq === 'weekly' ? r.amount * 52 / 12 / e : r.freq === 'yearly' ? r.amount / 12 / e : r.amount / e; };
function goalSaved(g) { return r3(live('goalMoves').filter(x => x.goalId === g.id).reduce((s, x) => s + x.amount, 0)); }
function monthsBetween(a, b) { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); }

/* ============ SUGGESTIONS ENGINE ============ */
function suggestions() {
  const out = [], t = todayS(), m = mk(t), day = parseD(t).getDate(), dim = daysInMonth(m);
  const prev = [1, 2, 3].map(i => shiftMonth(m, -i)).map(pm => ({ m: pm, ...monthActual(pm) })).filter(x => x.income > 0 || x.expense > 0);
  const avg = f => prev.length ? prev.reduce((s, x) => s + f(x), 0) / prev.length : 0;
  const p = projection(m);
  const L = { bad: 0, warn: 1, info: 2, good: 3 };
  const add = (level, icon, title, text) => out.push({ level, icon, title, text });

  if (!live('tx').length && !live('rec').length) {
    add('info', '👋', 'ابدأ بتسجيل عملياتك', 'أضف راتبك ومصروفاتك الثابتة (إيجار، اشتراكات، أقساط) في «المتكررة»، وستظهر هنا اقتراحات مبنية على أرقامك.');
    return out;
  }
  // 1) savings rate (projected)
  if (p.pIncome > 0) {
    const rate = (p.pIncome - p.pExpense) / p.pIncome;
    if (rate < 0) add('bad', '🚨', 'المصروف المتوقع يتجاوز الدخل', `بحسب العمليات والمتكررة، نهاية ${mLabel(m)} تتجه لعجز ${fmt(-p.pNet)} د.ك. راجع المصروفات القادمة أو أجّل غير الضروري.`);
    else if (rate < 0.1) add('warn', '📉', `نسبة الادخار المتوقعة ${Math.round(rate * 100)}%`, `المتبقي المتوقع ${fmt(p.pNet)} د.ك. قاعدة شائعة تستهدف ادخار 20% تقريبًا من الدخل (${fmt(p.pIncome * 0.2)} د.ك هذا الشهر).`);
    else if (rate >= 0.2) add('good', '🌟', `نسبة ادخار ممتازة: ${Math.round(rate * 100)}%`, `المتوقع أن يتبقى ${fmt(p.pNet)} د.ك. فكّر في تحويل جزء منه مباشرة إلى أحد أهدافك.`);
  }
  // 2) budgets
  const a = monthActual(m);
  for (const b of live('budgets')) {
    const spent = a.byCat[b.catId] || 0; const c = cat(b.catId); if (!b.limit) continue;
    const pct = spent / b.limit;
    if (pct >= 1) add('bad', '⛔', `تجاوزت ميزانية ${c.name}`, `صرفت ${fmt(spent)} من ${fmt(b.limit)} د.ك (${Math.round(pct * 100)}%).`);
    else if (pct >= 0.8) add('warn', '⚠️', `اقتربت من حد ${c.name}`, `المتبقي ${fmt(b.limit - spent)} د.ك لـ ${dim - day} يومًا — أي نحو ${fmt((b.limit - spent) / Math.max(1, dim - day))} د.ك يوميًا.`);
  }
  // 3) category spikes vs 3-month average
  if (prev.length) {
    for (const c of live('categories').filter(c => c.kind === 'expense')) {
      const cur = a.byCat[c.id] || 0; const av = avg(x => x.byCat[c.id] || 0);
      if (av > 0 && cur > av * 1.15 && cur - av >= 5) add('warn', c.icon, `${c.name}: أعلى من معدلك`, `صرفت هذا الشهر ${fmt(cur)} د.ك مقابل متوسط ${fmt(av)} د.ك في الأشهر السابقة (+${Math.round((cur / av - 1) * 100)}%).`);
    }
  }
  // 4) subscriptions
  const subs = live('rec').filter(r => r.type === 'expense' && r.catId === 'c_subs' && !r.paused);
  if (subs.length >= 2) { const tot = subs.reduce((s, r) => s + monthlyEq(r), 0); add('info', '📺', `${subs.length} اشتراكات بـ ${fmt(tot)} د.ك شهريًا`, `أي ${fmt(tot * 12)} د.ك سنويًا. إلغاء اشتراك واحد غير مستخدم يوفّر مبلغًا ثابتًا كل شهر.`); }
  // 5) income concentration & private lessons
  const incPrev = prev.reduce((s, x) => s + x.income, 0);
  if (incPrev > 0) {
    const sal = prev.reduce((s, x) => s + (x.byCat['c_salary'] || 0), 0);
    const les = prev.reduce((s, x) => s + (x.byCat['c_lessons'] || 0), 0);
    const lesTx = txAll().filter(x => x.catId === 'c_lessons' && x.date <= t);
    const perLesson = lesTx.length ? lesTx.reduce((s, x) => s + x.amount, 0) / lesTx.length : 0;
    if (sal / incPrev > 0.85) add('info', '🧩', `${Math.round(sal / incPrev * 100)}% من دخلك من الراتب`, perLesson > 0 ? `تنويع الدخل يقلل المخاطر. متوسط عملية «حصص خارجية» لديك ${fmt(perLesson)} د.ك؛ إضافة واحدة أسبوعيًا تضيف تقريبًا ${fmt(perLesson * 52 / 12)} د.ك شهريًا.` : 'تنويع مصادر الدخل (حصص خارجية، مكافآت، مشاريع جانبية) يقلل الاعتماد على مصدر واحد.');
    const lesAvg = les / prev.length; const lesCur = a.byCat['c_lessons'] || 0;
    if (lesAvg > 0 && day >= 20 && lesCur < lesAvg * 0.8) add('warn', '🧪', 'دخل الحصص الخارجية أقل من معدله', `${fmt(lesCur)} د.ك حتى الآن مقابل متوسط ${fmt(lesAvg)} د.ك شهريًا.`);
    if (lesAvg > 0 && lesCur > lesAvg * 1.2) add('good', '🧪', 'دخل الحصص الخارجية في ارتفاع', `${fmt(lesCur)} د.ك هذا الشهر مقابل متوسط ${fmt(lesAvg)} د.ك. هذا الفائض مناسب لتسريع أحد أهدافك.`);
  }
  // 6) goals feasibility
  const surplus = prev.length ? avg(x => x.net) : p.pNet;
  for (const g of live('goals')) {
    const saved = goalSaved(g), left = g.target - saved; if (left <= 0 || !g.date) continue;
    const months = Math.max(1, monthsBetween(m, mk(g.date)) + (g.date.slice(8) >= pad(day) ? 0 : 0));
    const need = left / months;
    if (surplus > 0 && need > surplus) add('warn', '🎯', `هدف «${g.name}» يحتاج ${fmt(need)} د.ك شهريًا`, `متوسط فائضك ${fmt(surplus)} د.ك. مدّد الموعد أو خفّض مصروفًا متغيرًا ليصبح الهدف واقعيًا.`);
    else if (surplus > 0) add('good', '🎯', `هدف «${g.name}» ممكن`, `يحتاج ${fmt(need)} د.ك شهريًا لمدة ${months} شهر، وهو ضمن متوسط فائضك (${fmt(surplus)} د.ك).`);
  }
  // 7) upcoming load
  const up14 = upcoming(14).filter(x => x.type === 'expense');
  const upSum = up14.reduce((s, x) => s + x.amount, 0);
  if (upSum > 0) { const late = up14.filter(x => x.overdue).length; add(late ? 'warn' : 'info', '📅', `${up14.length} مصروف قادم خلال 14 يومًا`, `المجموع ${fmt(upSum)} د.ك${late ? ` — منها ${late} متأخرة لم تُسجَّل بعد` : ''}.`); }
  // 8) dining share & top category
  const expAll = prev.reduce((s, x) => s + x.expense, 0) + a.expense;
  if (expAll > 0) {
    const din = prev.reduce((s, x) => s + (x.byCat['c_dining'] || 0), 0) + (a.byCat['c_dining'] || 0);
    if (din / expAll > 0.15) add('info', '☕', `المطاعم والمقاهي ${Math.round(din / expAll * 100)}% من مصروفك`, `خفضها بمقدار الربع يوفر تقريبًا ${fmt(din / (prev.length + 1) * 0.25 * 12)} د.ك سنويًا.`);
    const totals = {}; for (const x of [...prev, a]) for (const [k, v] of Object.entries(x.byCat)) if (cat(k).kind === 'expense') totals[k] = (totals[k] || 0) + v;
    const top = Object.entries(totals).sort((x, y) => y[1] - x[1])[0];
    if (top && !['c_housing', 'c_loans'].includes(top[0])) { const perM = top[1] / (prev.length + 1); add('info', cat(top[0]).icon, `أكبر بند متغير: ${cat(top[0]).name}`, `متوسطه ${fmt(perM)} د.ك شهريًا. توفير 10% منه فقط = ${fmt(perM * 0.1 * 12)} د.ك سنويًا.`); }
  }
  return out.sort((x, y) => L[x.level] - L[y.level]);
}

  openSheet(`<h3>🔑 تغيير كلمة سر التشفير</h3>
    <div class="note warn">ستُعاد تعمية كل البيانات بالكلمة الجديدة، وستطلب الأجهزة الأخرى الكلمة الجديدة عند فتحها.</div>
    <div class="f"><label>الكلمة الحالية</label><input id="cp0" type="password" dir="ltr"></div>
    <div class="f"><label>الكلمة الجديدة (8+)</label><input id="cp1" type="password" dir="ltr"></div>
    <div class="f"><label>تأكيدها</label><input id="cp2" type="password" dir="ltr"></div>
    <div class="err" id="cpE"></div><button class="btn" id="cpS">تغيير</button>`);
  $('#cpS').onclick = async () => {
    const e = $('#cpE'); e.textContent = '';
    const k0 = await deriveKey($('#cp0').value, SALT);
    try { const p = await encryptObj(KEY, { t: 1 }); await decryptObj(k0, p.iv, p.data); } catch { e.textContent = 'الكلمة الحالية غير صحيحة'; return; }
    if ($('#cp1').value.length < 8) { e.textContent = '8 أحرف على الأقل'; return; }
    if ($('#cp1').value !== $('#cp2').value) { e.textContent = 'التأكيد غير مطابق'; return; }
    $('#cpS').disabled = true;
    if (SB) { try { const remote = await fetchRemote(); if (remote && remote.version !== baseVersion && remote.salt === SALT) { state = merge(state, await decryptObj(KEY, remote.iv, remote.data)); baseVersion = remote.version; } } catch { e.textContent = 'تحتاج اتصالًا بالإنترنت لتغيير الكلمة'; $('#cpS').disabled = false; return; } }
    SALT = newSalt(); KEY = await deriveKey($('#cp1').value, SALT);
    await idbDel('key_' + USER.id); await idbSet('key_' + USER.id, { key: KEY, salt: SALT });
    await saveLocal(); if (SB) await pushNow({ newSalt: true });
    closeSheet(); toast('تم تغيير كلمة سر التشفير');
  };
}

/* ============ APP SHELL ============ */
function enterApp() {
  $('#authView').classList.add('hidden'); $('#appView').classList.remove('hidden');
  render();
}
$$('.tab').forEach(b => b.onclick = () => { VIEW = b.dataset.v; render(); scrollTo(0, 0); });
$('#mPrev').onclick = () => { VM = shiftMonth(VM, -1); render(); };
$('#mNext').onclick = () => { VM = shiftMonth(VM, 1); render(); };
$('#fab').onclick = () => txForm(null, VM !== mk(todayS()) ? { date: VM + '-01' } : null);
$('#btnSettings').onclick = settingsSheet;
if (!window.isSecureContext || !crypto.subtle) document.body.innerHTML = '<p style="padding:30px;text-align:center">يجب فتح التطبيق عبر https</p>';
else boot();
</script>
